<div class="page-header">
  <h1>{{ config.title }}</h1>
  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon> Nuevo {{ config.singular }}
  </button>
</div>

<div *ngIf="loading" style="display:flex; justify-content:center; padding: 48px;">
  <mat-spinner></mat-spinner>
</div>

<table mat-table [dataSource]="items" *ngIf="!loading" class="mat-elevation-z1">

  <ng-container *ngFor="let column of config.columns" [matColumnDef]="column.key">
    <th mat-header-cell *matHeaderCellDef>{{ column.label }}</th>
    <td mat-cell *matCellDef="let row">
      <span *ngIf="!cellIsBoolean(column.key)">{{ cellValue(row, column.key) }}</span>
      <span *ngIf="cellIsBoolean(column.key)"
            class="badge"
            [ngClass]="boolValue(row, column.key) ? 'badge-success' : 'badge-danger'">
        {{ boolValue(row, column.key) ? 'Sí' : 'No' }}
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef style="text-align:right;">Acciones</th>
    <td mat-cell *matCellDef="let row" class="actions-cell">
      <button mat-icon-button *ngIf="allowEdit" matTooltip="Editar" (click)="openEdit(row)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button *ngIf="allowDelete" matTooltip="Eliminar" (click)="confirmDelete(row)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<p *ngIf="!loading && items.length === 0" style="text-align:center; color:#777; padding: 32px;">
  No hay registros todavía.
</p>
